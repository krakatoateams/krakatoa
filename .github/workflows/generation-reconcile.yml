name: Generation reconcile

# BACKUP trigger for the reconcile endpoint (returns credits held after an unclear Fal run once
# Fal confirms the failure). The PRIMARY trigger is cron-job.org every 10 minutes (see
# docs/generation/fal-provider-runbook.md "Reconcile schedule"); the daily Vercel cron in
# vercel.json is the last backup. GitHub scheduled runs are best-effort and often start hours
# late, so this workflow alone does not give a 10-minute cadence. The endpoint is idempotent and
# time-bounded (stable refund keys, hasRefundForJob), so all three triggers overlapping is safe.
#
# Reuses the publisher's repository secrets (publish-cron.yml), so no extra setup:
#   CRON_TARGET_URL  production base URL, https only, e.g. https://your-app.com
#   CRON_SECRET      same value as CRON_SECRET in Vercel
# Until both exist the job skips with a notice (green). To turn it off: Actions -> this
# workflow -> "..." -> Disable workflow.
# The repo is public: the log shows the HTTP status and counts only, never ids or error text.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Only calls the deployed endpoint; no repository token needed.
permissions: {}

# Never overlap two runs.
concurrency:
  group: generation-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    # Scheduled runs already use the default branch; this also covers a manual run on another branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call reconcile endpoint
        env:
          BASE_URL: ${{ secrets.CRON_TARGET_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Skipped: set the CRON_TARGET_URL and CRON_SECRET repository secrets (see docs/generation/fal-provider-runbook.md)."
            exit 0
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "::error::CRON_TARGET_URL must start with https://"; exit 1 ;;
          esac

          # The header goes through stdin so the secret never appears in the process list or logs.
          # max-time stays below the route maxDuration (120 s); retries are off on purpose.
          # The reply goes to a file, never to the log (it can hold job ids and error text).
          set +e
          code=$(printf 'Authorization: Bearer %s' "$CRON_SECRET" | curl --silent --show-error \
            --fail-with-body --retry 0 --max-time 115 --proto '=https' --max-redirs 0 \
            -o "$RUNNER_TEMP/reply.json" -w '%{http_code}' \
            -H @- "${BASE_URL%/}/api/cron/generation-reconcile")
          rc=$?
          set -e
          echo "HTTP $code"
          # Counts only: numeric fields plus how many errors there were.
          jq -c 'with_entries(select(.value | type == "number")) + {errors: ((.errors // []) | length)}' \
            "$RUNNER_TEMP/reply.json" 2>/dev/null || echo "(no summary)"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Reconcile endpoint returned HTTP $code"
            exit 1
          fi
